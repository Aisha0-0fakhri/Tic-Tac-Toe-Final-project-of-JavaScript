<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>

  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <main>
    <div class="top">
      <h1>Tic Tac Toe</h1>
      <button type="button" class="theme-btn" id="theme">Dark mode</button>
    </div>

    <!-- Step 1: ask for the two names -->
    <form class="setup" id="setup" autocomplete="off">
      <h2>Who is playing?</h2>
      <div class="field">
        <label for="nameX"><b class="x">X</b> &middot; Player 1</label>
        <input id="nameX" type="text" maxlength="16" placeholder="Player 1">
      </div>
      <div class="field">
        <label for="nameO"><b class="o">O</b> &middot; Player 2</label>
        <input id="nameO" type="text" maxlength="16" placeholder="Player 2">
      </div>
      <button type="submit" class="btn primary">Start game</button>
    </form>

    <!-- Step 2: the game -->
    <section id="game" hidden>
      <div class="status" id="status" role="status" aria-live="polite"></div>

      <div class="board" id="board" role="grid" aria-label="Tic tac toe board" style="margin: 14px 0;"></div>

      <div class="score" aria-label="Scoreboard" style="margin-bottom: 14px;">
        <div><span class="n x-color" id="sx">0</span><span class="l" id="lx">Player 1</span></div>
        <div><span class="n" id="sd">0</span><span class="l">Draws</span></div>
        <div><span class="n o-color" id="so">0</span><span class="l" id="lo">Player 2</span></div>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="next">New round</button>
        <button type="button" class="btn" id="change">Change players</button>
      </div>
    </section>
  </main>

  <!-- Result pop-up -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="actions">
        <button type="button" class="btn primary" id="again">Play again</button>
        <button type="button" class="btn" id="reset">Reset scores</button>
      </div>
    </div>
  </div>

  <script src="java.js">
    
  </script>
</body>
</html>
